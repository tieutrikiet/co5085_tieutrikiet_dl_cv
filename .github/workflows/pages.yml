name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stage only the site files. Notebooks and results stay in the repo
      # but are deliberately not published to the Pages domain.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          cp -r pages  _site/
          touch _site/.nojekyll
          echo "--- staged ---"
          find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
