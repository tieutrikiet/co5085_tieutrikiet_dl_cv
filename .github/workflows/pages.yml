name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Stage only the site files. Source code and results stay in the repo
      # but are deliberately not published to the Pages domain.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          # Combined E1/E2/E3 report, published via assets/ and linked from
          # the E1, E2, E3 detail pages. Fail the deploy instead of shipping dead links.
          test -f "_site/assets/[CO5085][E1E2E3] Report.pdf"
          cp -r pages  _site/
          # Files linked from detail pages (reports, figures).
          mkdir -p _site/A1 _site/A2
          cp A1/*.pdf     _site/A1/
          # A1 report + figures rendered on the A1 detail page.
          test -f A1/A1-report.pdf
          mkdir -p _site/A1/figures
          cp -r A1/figures/results _site/A1/figures/
          cp -r A2/figures _site/A2/
          # Exercise notebooks are rendered client-side on their detail pages;
          # figures/ holds images the notebooks' markdown cells reference.
          for ex in E1 E2 E3; do
            mkdir -p _site/$ex
            cp $ex/notebook.ipynb _site/$ex/
            if [ -d $ex/figures ]; then cp -r $ex/figures _site/$ex/; fi
          done
          touch _site/.nojekyll
          echo "--- staged ---"
          find _site -type f | sort

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v4+ skips dotfiles by default; keep .nojekyll in the artifact.
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5
